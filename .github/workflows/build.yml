name: build
on: [push, pull_request]
jobs:
  windows-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ucrt64-build
          path: libpazgraphics.a
  windows-clang64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: make mingw-w64-clang-x86_64-clang
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v4
        with:
          name: windows-clang64-build
          path: libpazgraphics.a
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: libpazgraphics.a
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install cmake xorg-dev xvfb
          curl -LO https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip
          unzip glfw-3.4.zip
          cd glfw-3.4
          cmake -S . -B build -D GLFW_BUILD_WAYLAND=0
          cd build
          make
          sudo make install
      - name: Simulate Display
        run: Xvfb &
      - name: Build and Test
        run: |
          export DISPLAY=:0
          make -j
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: libpazgraphics.a
